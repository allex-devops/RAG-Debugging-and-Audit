[project]
name = "ragdoc"
version = "0.1.0"
description = "Find out what is wrong with a RAG system: planted faults, probes, latency profile, log analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdoc", "src/ragchat", "src/shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real chat and embedding model (needs LLM_BASE_URL, LLM_API_KEY, LLM_MODEL and EMBED_MODEL)"]
addopts = "-m 'not live'"
